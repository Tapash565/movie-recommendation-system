# Preview Deployment Workflow
#
# Triggered on every pull request push. Wires each Vercel frontend preview to
# the matching Render backend preview so QA sees a fully isolated full-stack
# environment.
#
# Required GitHub Secrets (Settings → Secrets and variables → Actions):
#   RENDER_API_KEY      — Render Dashboard → Account → API Keys
#   VERCEL_TOKEN        — Vercel Dashboard → Settings → Tokens
#   VERCEL_ORG_ID       — from `vercel link` or .vercel/project.json
#   VERCEL_PROJECT_ID   — from `vercel link` or .vercel/project.json
#
# Optional GitHub Variables (Settings → Secrets and variables → Variables):
#   RENDER_STAGING_URL  — fallback backend URL if Render preview times out
#                         (e.g. https://movie-api-staging.onrender.com)

name: Preview Deployment

on:
  pull_request:
    types: [opened, synchronize, reopened]

# Cancel any in-flight deploy for this PR when a new commit arrives.
concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  preview:
    name: Deploy PR Preview
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # ── Phase 1: Get the Render preview URL ─────────────────────────────────
      #
      # Render automatically names Service Preview instances:
      #   <service-name>-pr-<number>  →  movie-api-pr-42
      # The URL becomes: https://movie-api-pr-42.onrender.com
      #
      # We poll the Render API until the service appears (allow up to 10 min).

      - name: Wait for Render preview URL
        id: render
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_STAGING_URL: ${{ vars.RENDER_STAGING_URL }}
        run: |
          PR="${{ github.event.pull_request.number }}"
          SERVICE_NAME="movie-api-pr-${PR}"
          TIMEOUT=600    # 10 minutes
          INTERVAL=20
          elapsed=0

          echo "Polling Render API for preview service: ${SERVICE_NAME}"

          while [ "$elapsed" -lt "$TIMEOUT" ]; do
            RAW=$(curl -sf \
              -H "Authorization: Bearer ${RENDER_API_KEY}" \
              "https://api.render.com/v1/services?name=${SERVICE_NAME}&limit=1" \
              || echo "[]")

            URL=$(echo "$RAW" | python3 -c "
import sys, json
try:
    data = json.loads(sys.stdin.read())
    items = data if isinstance(data, list) else (data.get('result') or [])
    for item in items:
        svc = item.get('service', item)
        url = (svc.get('serviceDetails') or {}).get('url', '') or svc.get('url', '')
        if url:
            print(url.rstrip('/'))
            break
except Exception:
    pass
")

            if [ -n "$URL" ]; then
              echo "render_url=${URL}" >> "$GITHUB_OUTPUT"
              echo "Render preview is ready: ${URL}"
              exit 0
            fi

            echo "  ${elapsed}s elapsed — not ready yet. Retrying in ${INTERVAL}s…"
            sleep "$INTERVAL"
            elapsed=$((elapsed + INTERVAL))
          done

          # Fallback: use a shared staging backend so the Vercel preview is
          # still functional even if the Render preview timed out.
          FALLBACK="${RENDER_STAGING_URL:-https://movie-api-staging.onrender.com}"
          echo "Timed out after ${TIMEOUT}s. Using fallback: ${FALLBACK}"
          echo "render_url=${FALLBACK}" >> "$GITHUB_OUTPUT"

      # ── Phase 2: Build Next.js against the Render preview URL ───────────────
      #
      # NEXT_PUBLIC_* variables are baked into the build at compile time, so we
      # must inject NEXT_PUBLIC_API_URL before `vercel build` runs.
      # Writing it to .env.local guarantees highest Next.js precedence and
      # overrides whatever URL was pulled from Vercel's preview env vars.

      - name: Deploy Vercel preview
        id: vercel
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        working-directory: frontend
        run: |
          npm install --global vercel@latest --silent

          # Pull Vercel project settings and preview environment variables.
          vercel pull --yes --environment=preview \
            --token="${{ secrets.VERCEL_TOKEN }}"

          # Inject the Render preview URL — takes precedence over pulled vars.
          echo "NEXT_PUBLIC_API_URL=${{ steps.render.outputs.render_url }}" > .env.local

          # Build Next.js; NEXT_PUBLIC_API_URL is baked in at this step.
          vercel build --token="${{ secrets.VERCEL_TOKEN }}"

          # Deploy the prebuilt artifact and capture the Vercel preview URL.
          DEPLOY_URL=$(vercel deploy --prebuilt \
            --token="${{ secrets.VERCEL_TOKEN }}" \
            --meta githubCommitSha="${{ github.sha }}" \
            --meta githubPrId="${{ github.event.pull_request.number }}" \
            | tail -1)

          echo "vercel_url=${DEPLOY_URL}" >> "$GITHUB_OUTPUT"

          # Remove the injected file — never commit NEXT_PUBLIC_API_URL.
          rm -f .env.local

      # ── Phase 3: Post both URLs as a PR comment ──────────────────────────────
      #
      # The HTML comment `<!-- preview-deploy -->` is used as a stable marker
      # so subsequent pushes to the same PR replace the old comment instead of
      # accumulating multiple ones.

      - name: Post preview links to PR
        uses: actions/github-script@v7
        with:
          script: |
            const renderUrl = '${{ steps.render.outputs.render_url }}';
            const vercelUrl = '${{ steps.vercel.outputs.vercel_url }}';

            // Remove previous preview comment if present.
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const previous = comments.find(
              c => c.user.type === 'Bot' && c.body.includes('<!-- preview-deploy -->')
            );
            if (previous) {
              await github.rest.issues.deleteComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: previous.id,
              });
            }

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `<!-- preview-deploy -->
## 🚀 Preview Deployment Ready

| Service | URL |
|---------|-----|
| 🎬 **Frontend** | [Open preview](${vercelUrl}) |
| ⚙️ **Backend API** | [Open API](${renderUrl}) |
| 📖 **API Docs** | [Swagger UI](${renderUrl}/api/docs) |
| 🩺 **Health** | [/health](${renderUrl}/health) |

> This frontend preview is wired to its dedicated Render backend preview.`,
            });
