name: Backend CI (FastAPI)

on:
  push:
    paths:
      - "backend/**"
  pull_request:
    paths:
      - "backend/**"

jobs:
  backend:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ✅ Proper FastAPI import & app validation
      - name: FastAPI app import test
        env:
          PYTHONPATH: backend
        run: |
          python - <<EOF
          from app.main import app
          assert app is not None
          print("FastAPI app imported successfully")
          EOF

      # (Optional but recommended)
      - name: Run basic startup check
        env:
          PYTHONPATH: backend
        run: |
          python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 --lifespan on &
          sleep 3
          pkill -f uvicorn

      - name: Docker build
        run: docker build -t movie-recommender-backend .