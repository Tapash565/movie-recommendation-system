services:
  backend:
    env_file:
      - ./backend/.env.production
    environment:
      - ENVIRONMENT=production
      - FIREBASE_SERVICE_ACCOUNT_PATH=/code/firebase-adminsdk.json
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
    volumes:
      - ./backend/firebase-adminsdk.json:/code/firebase-adminsdk.json:ro

  frontend:
    env_file:
      - ./frontend/.env.production
    environment:
      - NODE_ENV=production

  redis:
    image: redis:7-alpine
    restart: always
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  redis-data:
